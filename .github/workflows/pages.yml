name: Deploy web client to GitHub Pages

# Публикуем статический веб-клиент (evolute_client.html) на GitHub Pages.
# ВАЖНО: на Pages едет ТОЛЬКО HTML-клиент. Flask-прокси (evolute_api.py)
# на Pages работать не может — его нужно держать на своём хосте.
# Подробности: docs/GITHUB_PAGES.md

on:
  push:
    branches:
      - main
    paths:
      - "evolute_client.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно — только один деплой; новый push отменять не будем,
# чтобы не ломать уже начатую публикацию.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать статический сайт
        run: |
          set -eu
          mkdir -p _site
          cp evolute_client.html _site/index.html
          # дублируем под исходным именем, чтобы работали старые ссылки
          cp evolute_client.html _site/evolute_client.html
          # .nojekyll — чтобы Pages не пытался обрабатывать файлы Jekyll'ом
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
